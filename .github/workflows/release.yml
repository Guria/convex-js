name: Release

# Publishes @reatomized/convex when package.json on `reatom` holds a version
# npm doesn't have yet, then tags the commit `v<version>`.
on:
  push:
    branches: [reatom]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check whether the version is published
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "@reatomized/convex@$version" version 2>/dev/null | grep -q .; then
            echo "@reatomized/convex@$version is on npm already."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (configured on npmjs.com for this repo and
      # release.yml) needs npm 11.5.1 or later. No NPM_TOKEN secret.
      - name: Update npm
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      # @reatom/core comes from a pkg.pr.new URL, which npm 12 installs only
      # when allowed.
      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm ci --allow-remote=root

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          npm run typecheck
          npm test -- --silent=true

      # prepack builds the package.
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: npm pack

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm publish "reatomized-convex-$VERSION.tgz" --access public

      - name: Tag
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
