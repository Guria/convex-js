name: Release

# Publishes reatom-convex when package.json on `reatom` holds a version npm
# doesn't have yet, then tags the commit `reatom-convex@<version>`.
on:
  push:
    branches: [reatom]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release tag
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # scripts/build.py runs through uv.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Check whether the version is published
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "reatom-convex@$version" version 2>/dev/null | grep -q .; then
            echo "reatom-convex@$version is on npm already."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing (configured on npmjs.com for this repo and
      # release.yml) needs npm 11.5.1 or later. No NPM_TOKEN secret.
      - name: Update npm
        if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest

      # Upstream's dev dependencies conflict: @vitest/eslint-plugin wants
      # TypeScript 6 and the package pins 5.0. @reatom/core comes from a
      # pkg.pr.new URL, which npm 12 installs only when allowed.
      - name: Install
        if: steps.version.outputs.publish == 'true'
        run: npm i --legacy-peer-deps --allow-remote=root

      - name: Test
        if: steps.version.outputs.publish == 'true'
        run: |
          npm run typecheck
          npx vitest run --silent=true

      # prepack checks the version and builds; postpack strips internal types
      # from the tarball, so publish the tarball rather than the directory.
      - name: Pack
        if: steps.version.outputs.publish == 'true'
        run: npm pack

      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run:
          npm publish "reatom-convex-${{ steps.version.outputs.version }}.tgz"
          --access public

      - name: Tag
        if: steps.version.outputs.publish == 'true'
        run: |
          tag="reatom-convex@${{ steps.version.outputs.version }}"
          git tag "$tag"
          git push origin "$tag"
